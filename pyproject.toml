[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_network"
version = "0.1.0"
description = "Convolutional neural network for email address validation using python and pytorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "pandas",
]